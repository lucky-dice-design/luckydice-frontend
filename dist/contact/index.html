<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Kontakt zu Lucky Dice Design aufnehmen." />
    <title>Kontakt | Lucky Dice Design</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="/assets/config.js"></script>
    <script type="module" src="/assets/main.js"></script>
  </head>
  <body data-page="contact">
    <header class="site-header">
      <a class="brand-mark" href="/" aria-label="Lucky Dice Design Startseite">
        <img class="brand-logo" src="/assets/luckydice-logo.svg" alt="" />
        <span>Lucky Dice Design</span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span><span></span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Hauptnavigation"></nav>
    </header>

    <main>
      <section class="contact-layout">
        <div>
          <h1 data-content="contact.title">Erzähl mir, was du bauen willst.</h1>
          <p data-content="contact.text">Schreib mir kurz, worum es geht: Website, UI/UX, SEO/KI Analyse, Frontend oder E-Mail Design. Ich melde mich mit einem klaren nächsten Schritt.</p>
          <div class="contact-lines" data-repeat="contact-lines"></div>
        </div>

        <form class="contact-form" id="contact-form" onsubmit="return window.LDD_submitContact(event)">
          <label>
            Name
            <input name="name" type="text" autocomplete="name" required />
          </label>
          <label>
            E-Mail
            <input name="email" type="email" autocomplete="email" required />
          </label>
          <label>
            Projektart
            <select name="project_type" required>
              <option value="">Bitte wählen</option>
              <option>Website</option>
              <option>Website Design UI/UX</option>
              <option>Frontend Entwicklung</option>
              <option>SEO und KI Analyse</option>
              <option>E-Mail Design</option>
              <option>Sonstiges</option>
            </select>
          </label>
          <label>
            Nachricht
            <textarea name="message" rows="6" required></textarea>
          </label>
          <button class="button primary" type="submit">Anfrage senden</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer"></footer>
  </body>
</html>
